name: Test, build and publish vctrmemo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JS syntax
        run: |
          node --check app.js
          node --check sync-core.js
          node --check transfer.js
      - name: Test merge/conflict and transmission
        run: |
          node tests/test-core.cjs
          node tests/test-transfer.cjs
          node tests/test-v04.cjs
          node tests/test-v05.cjs
          node tests/test-v06.cjs
          node tests/test-v07.cjs
          node tests/test-v08.cjs
          node tests/test-v09.cjs
          node tests/test-v010.cjs
      - name: Install browser-only encrypted sync dependencies
        run: npm install --no-save --no-package-lock nostr-tools@2.23.8 esbuild@0.25.12
      - name: Encrypted owner sync unit and two-client relay tests
        run: |
          node --test owner-sync/tests/codec.test.mjs
          node --test owner-sync/tests/relay.test.mjs
      - name: Install browser test requirements
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Browser integration test
        run: |
          python tests/test-browser.py
          python tests/test-v04-browser.py
          python tests/test-v05-browser.py
          python tests/test-v06-browser.py
          python tests/test-v07-browser.py
          python tests/test-v08-browser.py
          python tests/test-v09-browser.py
          python tests/test-v010-browser.py
          python tests/test-v011-browser.py
          python tests/test-v012-browser.py
      - name: Build WebXDC and Pages preview
        run: python scripts/build.py
      - name: Bundle browser-only owner sync module
        run: ./node_modules/.bin/esbuild owner-sync/ui.mjs --bundle --platform=browser --target=es2022 --format=esm --outfile=dist/site/owner-sync.js
      # Main remains the stable site. The experimental browser candidate gets
      # an independent URL, relay identity and localStorage namespace.
      - name: Check out tested sync candidate for isolated preview
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          ref: fa08b835ff84de9f9f97fdd44c5e0ebf6b76f8b5
          path: owner-candidate
          persist-credentials: false
      - name: Build isolated owner-sync release candidate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python owner-candidate/scripts/build.py
          ./node_modules/.bin/esbuild owner-candidate/owner-sync/ui.mjs --bundle --platform=browser --target=es2022 --format=esm --outfile=owner-candidate/dist/site/owner-sync.js
          mkdir -p dist/site/rc
          rsync -a --exclude='*.xdc' owner-candidate/dist/site/ dist/site/rc/
          python - <<'PY'
          from pathlib import Path
          base=Path('dist/site/rc')
          boot=base/'synced/link-bootstrap.mjs'
          source=boot.read_text(encoding='utf-8')
          source_key="'vctrmemo:scoped-local:v1:'+secret"
          assert source.count(source_key)==1
          source=source.replace(source_key, "'vctrmemo:scoped-local:rc:v1:'+secret")
          assert source.count('window.__vctrmemo_owner_secret=secret;')==1
          source=source.replace('window.__vctrmemo_owner_secret=secret;',
            "window.__vctrmemo_owner_secret=hex(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('vctrmemo:rc:v1:'+secret))));")
          boot.write_text(source,encoding='utf-8')
          page=base/'synced/index.html'
          html=page.read_text(encoding='utf-8')
          label='<div role="note" style="position:fixed;top:0;right:0;z-index:20005;background:#6b320b;color:#fff;padding:5px 10px;font:12px system-ui">vctrmemo 同期修正版・テスト専用</div>'
          assert html.count('</body>')==1
          page.write_text(html.replace('</body>',label+'\n</body>'),encoding='utf-8')
          assert (base/'owner-sync.js').exists()
          assert (base/'synced/app.js').exists()
          assert (base/'synced/link-bootstrap.mjs').exists()
          assert not list(base.rglob('*.xdc'))
          assert 'vctrmemo:rc:v1:' in boot.read_text()
          print('ISOLATED RC: dist/site/rc/synced/ is separate from /synced/ and XDC')
          PY
      - name: Verify owner sync stays out of WebXDC
        run: python owner-sync/tests/package.test.py
      - name: Verify bundle and preview
        run: python tests/test-package.py
      - name: Build and publish URL-launchable diagnostic XDC
        run: |
          python scripts/build-vector-owner-probe.py
          cp dist/probes/vctrmemo-owner-realtime-auto-v2.xdc dist/site/vctrmemo-owner-realtime-auto-v2.xdc
          cp dist/probes/vctrmemo-owner-realtime-auto-v2.xdc dist/site/vctrmemo-owner-realtime-test.xdc
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          published=Path('dist/site/vctrmemo-owner-realtime-auto-v2.xdc')
          original=Path('dist/probes/vctrmemo-owner-realtime-auto-v2.xdc')
          assert published.read_bytes()==original.read_bytes()
          assert Path('dist/site/vctrmemo-owner-realtime-test.xdc').read_bytes()==original.read_bytes()
          with ZipFile(published) as archive:
              assert archive.testzip() is None
              assert set(archive.namelist())=={'index.html','manifest.toml','vector-live/probe-core.mjs','vector-live/probe-ui.mjs'}
              assert b'joinRealtimeChannel' in archive.read('vector-live/probe-core.mjs')
          print('URL-launchable Vector diagnostic archive verified:',published)
          PY
      - name: Upload test-only URL-launchable XDC
        uses: actions/upload-artifact@v4
        with:
          name: vctrmemo-owner-realtime-auto-v2-xdc
          path: dist/site/vctrmemo-owner-realtime-auto-v2.xdc
          retention-days: 14
      - name: Upload tested WebXDC (no source ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: vctrmemo-xdc
          path: dist/vctrmemo.xdc
          retention-days: 14
      - name: Upload Pages preview
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  publish-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy browser preview
        id: deployment
        uses: actions/deploy-pages@v4
